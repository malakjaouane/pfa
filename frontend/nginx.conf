# ==================================================================
# nginx : sert le build React et transmet /api/ au backend.
#
# Le front et l'API sont alors sur une même origine : aucune requête
# CORS n'est émise par le navigateur, et baseURL: '/api' (api.js)
# fonctionne tel quel, sans variable d'environnement à build.
# ==================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS : le navigateur ne réutilise ensuite que HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API : proxy vers le service « backend » du réseau compose ---
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Transmis au backend : ProtectionConnexions limite les tentatives
        # de connexion par adresse réelle et non par celle du conteneur.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Application SPA : toutes les routes sont gérées par React ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets sont hashés par Vite : cache long possible.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
